name: OctoFox Companion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['OctoFoxBook/companion/**', '.github/workflows/octofox-companion.yml']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            flags: --win
          - os: macos-15
            target: macos-universal
            flags: --mac --universal
          - os: ubuntu-24.04
            target: linux
            flags: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: OctoFoxBook/companion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: OctoFoxBook/companion/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - name: Native app smoke (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:app
      - name: Native app smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:app
      - run: npm run dist -- ${{ matrix.flags }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OctoFox-Companion-${{ matrix.target }}
          path: |
            OctoFoxBook/companion/dist/*.exe
            OctoFoxBook/companion/dist/*.zip
            OctoFoxBook/companion/dist/*.dmg
            OctoFoxBook/companion/dist/*.AppImage
            OctoFoxBook/companion/dist/*.deb
          if-no-files-found: error
          retention-days: 14
