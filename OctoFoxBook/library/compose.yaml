name: octofox-library

x-service: &service
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  library:
    <<: *service
    build: .
    image: octofox-library:0.1.0-alpha1
    environment:
      OCTOFOX_DB: /data/library.sqlite3
      OCTOFOX_UPSTREAM: http://booklore:6060/api/v1/opds
      OCTOFOX_ORIGIN: ${OCTOFOX_ORIGIN:?Run python tools/configure.py first}
      OCTOFOX_BIND: 0.0.0.0
      OCTOFOX_PORT: "8080"
      OCTOFOX_PUBLISHED_BIND: ${OCTOFOX_BIND_ADDRESS:-0.0.0.0}
      OCTOFOX_DISCOVERY_PORT: "49645"
      OCTOFOX_PUBLISHED_PORT: ${OCTOFOX_PORT:-8080}
      OCTOFOX_SPEECH_SOCKET: /run/speech/speech.sock
    ports:
      - "${OCTOFOX_BIND_ADDRESS:-0.0.0.0}:${OCTOFOX_PORT:-8080}:8080"
      - "${OCTOFOX_BIND_ADDRESS:-0.0.0.0}:${OCTOFOX_DISCOVERY_PORT:-49645}:49645/udp"
    volumes:
      - library-data:/data
      - speech-socket:/run/speech:ro
    networks: [library]
    depends_on:
      booklore: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5).read()"]
      interval: 20s
      timeout: 8s
      retries: 3

  booklore:
    <<: *service
    init: false
    image: ghcr.io/booklore-app/booklore:v2.3.1@sha256:d3d3af34bc2cc44349178535ce19e86049968fba2e7d2acf965f770bf37bad01
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: ${TZ:-UTC}
      BOOKLORE_PORT: "6060"
      DATABASE_URL: jdbc:mariadb://database:3306/booklore
      DATABASE_USERNAME: booklore
      DATABASE_PASSWORD: ${BOOKLORE_DB_PASSWORD:?Database password is required}
      FORCE_DISABLE_OIDC: "true"
      ALLOWED_ORIGINS: ${OCTOFOX_ORIGIN}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1536m -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:${BOOKLORE_ADMIN_PORT:-8081}:6060"]
    volumes:
      - booklore-data:/app/data
      - catalog-books:/books
    networks: [library, database]
    depends_on:
      database: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD, wget, -q, -O, "-", http://localhost:6060/api/v1/healthcheck]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s

  database:
    <<: *service
    init: false
    image: lscr.io/linuxserver/mariadb:11.4.8@sha256:91de7f701bc7fc3a424b81beafca7a7c6c4c5b7c8be6afd2ae148698695c0b0c
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Database root password is required}
      MYSQL_DATABASE: booklore
      MYSQL_USER: booklore
      MYSQL_PASSWORD: ${BOOKLORE_DB_PASSWORD}
    volumes: [database-data:/config]
    networks: [database]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD, mariadb-admin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  speech:
    <<: *service
    profiles: [speech]
    build:
      context: .
      dockerfile: speech/Dockerfile
    image: octofox-speech:0.1.0-alpha1
    network_mode: none
    volumes: [speech-socket:/run/speech]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: [CMD, python, /app/healthcheck.py]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 90s

networks:
  library:
  database: {internal: true}

volumes:
  library-data:
  booklore-data:
  catalog-books:
  database-data:
  speech-socket:
