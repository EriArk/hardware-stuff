<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>OctoFox Companion</title><link rel="stylesheet" href="shell.css"></head>
<body><header><strong>OCTOFOX <span>COMPANION</span></strong><div id="connected" hidden><span id="server-name"></span><button id="manage">Companion</button><button id="library">Library</button><button id="switch">Switch library</button></div></header>
<main id="finder"><div class="orbit" aria-hidden="true"><span>✧</span></div><p class="eyebrow">YOUR BOOKS, CLOSE BY</p><h1 id="title">Finding your library</h1><p id="description">Looking on this computer and your local network…</p><div id="progress" class="progress" aria-hidden="true"></div><div id="servers"></div><p id="error" role="alert" hidden></p><button id="retry" class="primary" hidden>Search again</button><details id="manual"><summary>Connect by address</summary><form id="address-form"><label for="address">Library address</label><div class="address-row"><input id="address" placeholder="192.168.1.20:8080 or https://books.example.org" autocomplete="url" required><button type="submit" class="primary">Connect</button></div></form></details><p class="footnote">The app opens the interface hosted by your server.<br>Your books stay in your library.</p></main><script src="shell.js"></script></body></html>
